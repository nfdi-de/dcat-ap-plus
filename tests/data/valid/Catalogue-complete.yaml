      description:
        - "The RightsStatement ID from the Access Rights Named Authority List as mandated by the DCAT-AP specs."
  title:
    - "The RightsStatement for this catalogue"
  description:
    - "The catalogue is open access."
service: # range: DataService
  - id: "https://example.org/"
    title:
        - "OAI-PMH Service"
    description:
        - "Service for harvesting metadata."
    endpoint_URL: # range: Resource
      - id: "https://example.org/catalogue/cat-001/oai/"
        title:
          - "OAI Endpoint"

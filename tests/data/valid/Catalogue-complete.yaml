# A complete example of a DCAT-AP+ Catalogue instance
id: "https://example.org/catalogue/cat-001"
applicable_legislation: # range LegalResource
  - identifier: "https://eur-lex.europa.eu/eli/reg/2016/679/oj/eng"
    other_identifier:
      - notation: "https://eur-lex.europa.eu/eli/reg/2016/679/oj/eng"
      - notation: "https://gdpr-info.eu/"
    title:
      - "General Data Protection Regulation (GDPR)"
    description:
      - "EU regulation on data protection and privacy."
  - identifier: "https://creativecommons.org/licenses/by/4.0"
    other_identifier:
      - notation: "https://creativecommons.org/licenses/by/4.0/rdf"
        title:
          - "RDF ID"
        description:
          - "The id to be used to explicitly refer to the RDF representation of the CC-BY 4.0 licence."
      - notation: "https://creativecommons.org/licenses/by/4.0/"
        title:
          - "CC-BY 4.0 id"
        description:
          - "The canonical idenfier used for the CC-BY 4.0 license"
    title:
      - "Attribution 4.0 International"
      - "CC-BY 4.0"
    description:
      - "You are free to: ... "
catalogue: # range: Catalogue
  - id: "https://example.org/catalogue/sub-cat-001"
    title:
      - "Sub-Catalogue for Specific Domain"
    description:
      - "A specialized sub-catalogue."
    publisher: # range: Agent
      name:
        - "European Environmental Agency"
      identifier: "http://publications.europa.eu/resource/authority/corporate-body/EEA"
      type:
        identifier: "http://purl.org/adms/publishertype/GovernmentAgency"
        preferred_label:
          - "Government Agency"
creator: # range: Agent
  name:
    - "Peter Parker"
  identifier: "https://orcid.org/0000-0002-0003-0004"
  other_identifier:
    - notation: "https://orcid.org/0000-0002-0003-0004"
      title:
        - "ORCID"
      description:
        - "The ORCID of the dataset creator."
  type:
    identifier: "http://purl.org/adms/publishertype/PrivateIndividual(s)"
    preferred_label:
       - "PrivateIndividual(s)"
    other_identifier:
      - notation: "http://purl.org/adms/publishertype/PrivateIndividual(s)"
        description:
          - "The identifier for classifying people according to the DCAT-AP mandated ADMS publisher type vocabulary."
  rdf_type:
    id: "foaf:Person"
description:
  - "This catalogue aggregates datasets related to environmental monitoring across Europe."
  - "Dieser Katalog sammelt Datensätze zur Umweltüberwachung in ganz Europa."
geographical_coverage: # range: Location
  # Brazil Instance
  - description:
      - "Brazil, officially the Federative Republic of Brazil, is the largest country in South America and the fifth-largest in the world by area."
      - "Brasil, oficialmente República Federativa do Brasil, é o maior país da América do Sul e o quinto maior do mundo em área."
    title:
      - Brazil
      - Federative Republic of Brazil
      - Brasil
      - República Federativa do Brasil
    identifier: "http://publications.europa.eu/resource/authority/country/BRA"
    other_identifier:
      - notation: "ISO3166-1:BRA"
      - notation: "http://publications.europa.eu/resource/authority/country/BRA"
        description:
          - "The identifier from the EU Vocabularies Countries Named Authority List, as mandated by the DCA-AP specs."
      - notation: "UN:M49:076"
      - notation: "FIPS:BR"
      - notation: "GNS:-1058129"
    bbox: "POLYGON((-73.9872 -33.7507, -34.7929 -33.7507, -34.7929 5.2718, -73.9872 5.2718, -73.9872 -33.7507))"
    centroid: "POINT(-54.3900 -14.2394)"
    geometry:
      wkt: "POINT(-47.9292 -15.7801)"
      gml: |
        <gml:Point xmlns:gml="http://www.opengis.net/gml/3.2" srsName="http://www.opengis.net/def/crs/OGC/1.3/CRS84">
          <gml:pos>-47.9292 -15.7801</gml:pos>
        </gml:Point>
      latitude: "-15.7801"
      longitude: "-47.9292"
      crs: "http://www.opengis.net/def/crs/OGC/1.3/CRS84"
      coordinates: "-47.9292, -15.7801"
  # Germany Instance
  - description:
      - Germany, officially the Federal Republic of Germany, is a country in Central Europe. It is the second-most populous country in Europe after Russia and the most populous member state of the European Union.
      - Deutschland, offiziell Bundesrepublik Deutschland, ist ein Land in Mitteleuropa. Es ist nach Russland das zweitbevölkerungsreichste Land Europas und das bevölkerungsreichste Mitglied der Europäischen Union.
    title:
      - Germany
      - Federal Republic of Germany
      - Deutschland
      - Bundesrepublik Deutschland
    identifier: "http://publications.europa.eu/resource/authority/country/DEU"
    other_identifier:
      - notation: "ISO3166-1:DEU"
      - notation: "http://publications.europa.eu/resource/authority/country/DEU"
        description:
          - "The identifier from the EU Vocabularies Countries Named Authority List, as mandated by the DCA-AP specs."
      - notation: "UN:M49:276"
      - notation: "FIPS:GM"
      - notation: "GNS:-1823572"
    bbox: "POLYGON((5.8663 47.2701, 15.0419 47.2701, 15.0419 55.0581, 5.8663 55.0581, 5.8663 47.2701))"
    centroid: "POINT(10.4515 51.1657)"
    geometry:
      wkt: "POINT(13.4050 52.5200)"
      gml: |
        <gml:Point xmlns:gml="http://www.opengis.net/gml/3.2" srsName="http://www.opengis.net/def/crs/OGC/1.3/CRS84">
          <gml:pos>13.4050 52.5200</gml:pos>
        </gml:Point>
      latitude: "52.5200"
      longitude: "13.4050"
      crs: "http://www.opengis.net/def/crs/OGC/1.3/CRS84"
      coordinates: "13.4050, 52.5200"
has_dataset: # range: Dataset
  - id: "https://example.org/dataset/env-monitoring-001"
    title:
      - "Environmental Monitoring Dataset 2025"
    description:
      - "Key dataset in this catalogue."
    was_generated_by:
      - id: "https://example.org/activity/env-monitoring-001"
has_part: # range: Catalogue
  - id: "https://example.org/catalogue/cat-001-part-A"
    title:
      - "Part A: Air Quality"
    description:
      - "Section dedicated to air quality data."
    publisher:
      name:
        - "European Environmental Agency"
      identifier: "http://publications.europa.eu/resource/authority/corporate-body/EEA"
      type:
        identifier: "http://purl.org/adms/publishertype/GovernmentAgency"
        preferred_label:
          - "Government Agency"
homepage: # range: Document
  identifier: "https://example.org/catalogue/cat-001/home"
  other_identifier:
    - notation: "https://example.org/catalogue/cat-001/home"
  title:
    - "Catalogue Homepage"
  description:
    - "Main entry point for the catalogue."
language: # range: LinguisticSystem
  - identifier: "http://publications.europa.eu/resource/authority/language/ENG"
    title:
        - "English"
    description:
        - "Primary language of metadata."
  - identifier: "http://publications.europa.eu/resource/authority/language/DEU"
    title:
        - "German"
    description:
        - "Secondary language of metadata."
licence: # range: LicenceDocument
  identifier: "http://creativecommons.org/licenses/by/4.0/"
  other_identifier:
    - notation:  "http://creativecommons.org/licenses/by/4.0/"
  title:
    - "CC BY 4.0"
  description:
    - "Creative Commons Attribution 4.0 International"
modification_date: "2026-06-19"
publisher: # range: Agent
  name:
    - "European Environmental Agency"
  identifier: "http://publications.europa.eu/resource/authority/corporate-body/EEA"
  type:
    identifier: "http://purl.org/adms/publishertype/GovernmentAgency"
    preferred_label:
      - "Government Agency"
